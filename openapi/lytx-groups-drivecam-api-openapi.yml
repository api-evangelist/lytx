components:
  schemas:
    BulkMoveGroupResponse:
      title: BulkMoveGroupResponse
      type: object
      required:
      - MovedGroups
      - UnmovedGroups
      properties:
        MovedGroups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          description: A list of groups that were moved successfully.
        UnmovedGroups:
          type: array
          items:
            $ref: '#/components/schemas/UnmovedGroup'
          description: A list of groups that were not moved with corresponding error messages.
    ImportGroupsResponse:
      title: ImportGroupsResponse
      type: object
      properties:
        importedGroups:
          type: array
          items:
            type: string
            example: Root\Group1
          description: List of group names that were successfully imported.
        existingGroups:
          type: array
          items:
            type: string
            example: Root\ExistingGroup
          description: List of group names that already existed and were not imported.
        groupsFailedToImport:
          type: array
          items:
            type: string
            example: Root\Group3\FailedGroup
          description: List of group names that failed to import as Group3 is not present.
        invalidGroupNames:
          type: array
          items:
            type: string
            example: InvalidGroup
          description: List of group names that were invalid and could not be imported.
    EditGroupRequest:
      title: EditGroupRequest
      type: object
      properties:
        name:
          type: string
          example: testGroupName
          description: Name of the group to edit.
        parentId:
          type: string
          example: 880e70d8-aaf8-18aa-7ab0-6533d8f1c360
          description: ID of the new parent group. The group will be moved under this parent.
        description:
          type: string
          example: A group being edited.
          description: Custom field.
    Group:
      title: Group
      type: object
      required:
      - id
      - createdDate
      - fullPath
      - fullPathId
      - name
      - parentId
      - revision
      - rootGroupId
      - updatedDate
      properties:
        id:
          type: string
          example: 0c3c9820-3ee4-e98d-0987-c7333e722f72
        createdDate:
          type: string
          example: '2023-01-01T00:00:00Z'
        description:
          type: string
          example: this is a description
        fullPath:
          type: string
          example: '***Root\Food Transportation INC'
        fullPathId:
          type: string
          example: 750c5226-0f0a-402d-dcec-f83ccbb5373e\0c3c9820-3ee4-e98d-0987-c7333e722f72
        name:
          type: string
          example: Food Transportation INC
        parentId:
          type: string
          example: 750c5226-0f0a-402d-dcec-f83ccbb5373e
        revision:
          type: number
          example: 1
        rootGroupId:
          type: string
          example: 750c5226-0f0a-402d-dcec-f83ccbb5373e
        updatedDate:
          type: string
          example: '2023-02-01T00:00:00Z'
    BulkMoveGroupRequest:
      title: BulkMoveGroupRequest
      type: object
      required:
      - op
      - path
      - value
      properties:
        op:
          type: string
          example: replace
          description: It should be replace keyword always.
        path:
          type: string
          example: 880e70d8-aaf8-18aa-7ab0-6533d8f1c360/parentId
          description: Id of the moving group followed by parentId keyword.
        value:
          type: string
          example: 780e70d8-aaf8-18aa-7ab0-6533d8f1c390/Id
          description: Id of the parent group followed by Id keyword.
    AddGroupRequest:
      title: AddGroupRequest
      type: object
      required:
      - name
      - parentId
      properties:
        name:
          type: string
          example: testGroupName
          description: Name of the group to create.
        parentId:
          type: string
          example: 880e70d8-aaf8-18aa-7ab0-6533d8f1c360
          description: ID of the parent group. The new group will be placed under this parent.
        description:
          type: string
          example: A new group being added.
          description: Custom field.
    UnmovedGroup:
      title: UnmovedGroup
      type: object
      required:
      - Group
      - ErrorMessage
      properties:
        Group:
          $ref: '#/components/schemas/Group'
        ErrorMessage:
          type: string
          description: The error message describes why the group was not moved.
    GroupInfo:
      type: object
      additionalProperties: false
      required:
      - id
      - parentId
      - fullPath
      - name
      - aRevision
      - aRevisionDate
      - creationDate
      properties:
        id:
          type: string
          description: Unique id of the group within the system.
          format: guid
          minLength: 1
        parentId:
          type: string
          description: Unique group id of the parent of the particular group.
          format: guid
          minLength: 1
        fullPath:
          type: string
          description: Full path to the group, includes escaping of special characters.
          minLength: 1
        name:
          type: string
          description: Name of the group.
          minLength: 1
        aRevision:
          type: integer
          description: Revision number of the group object.
          format: int32
        aRevisionDate:
          type: string
          description: Latest revision date of the group.
          format: date-time
          minLength: 1
        creationDate:
          type: string
          description: Creation date of the group
          format: date-time
          minLength: 1

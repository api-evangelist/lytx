openapi: 3.2.0
info:
  title: Lytx Groups (DriveCam) API
  version: 1.0.0
  description: 'Operations tagged Groups (DriveCam) across 2 of this provider''s published API definitions: lytx-group-openapi.yml, lytx-legacy.groups-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.lytx.com/v1
- url: https://lytx-api.prod2.ph.lytx.com/groups
- url: https://lytx-api.prod5.ph.lytx.com/groups
- url: https://lytx-api.prod6.lv.lytx.com/groups
- url: https://lytx-api.prod7.lv.lytx.com/groups
- url: https://lytx-api.prod8.lv.lytx.com/groups
tags:
- name: Groups (DriveCam)
paths:
  /groups:
    get:
      tags:
      - Groups (DriveCam)
      description: Retrieve a list of groups in an organization.
      summary: Retrieve List of Groups
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          example: '100'
        description: Number of records to return.
      - name: offset
        in: query
        schema:
          type: integer
          example: '0'
        description: Record to start with.
      - name: groupIds
        in: query
        schema:
          type: string
        description: IDs of groups to return.
      - name: includeSubgroups
        in: query
        schema:
          type: boolean
          example: 'false'
        description: If true, all subgroups under the specified group are included.
      - name: sort
        in: query
        schema:
          type: string
          example: Description
        description: Name of the property to sort on.
      - name: order
        in: query
        schema:
          type: string
          example: asc
        description: Sort direction.
      - name: encodeFullPath
        in: query
        schema:
          type: boolean
          example: 'false'
          default: true
        description: If true, all returned groups will have their fullPath property url encoded.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 880e60d8-fbed-217a-1720-6511d9f16361
                          description: ID of the group.
                        createdDate:
                          type: string
                          example: '0001-01-01T00:00:00'
                          description: Date and time when the group was created.
                        description:
                          type: string
                          example: Description Here
                          description: Custom field.
                        fullPath:
                          type: string
                          example: Test Root Group\Test Parent Group\Test Group Name
                          description: Full path from the root group to the target group using group names.
                        fullPathId:
                          type: string
                          example: 880e60d8-fbed-217c-1720-6511d9f16361\880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217a-1720-6511d9f16361
                          description: Full path from the root group to the target group using group IDs.
                        name:
                          type: string
                          example: Test Group Name
                          description: Name of the group.
                        parentId:
                          type: string
                          example: 880e60d8-fbed-217b-1720-6511d9f16361
                          description: ID of the parent group directly above the target group.
                        revision:
                          type: number
                          example: 1
                          description: Revision number for the group.
                        rootGroupId:
                          type: string
                          example: 880e60d8-fbed-217b-1720-6511d9f16361
                          description: ID of the highest level root group in the organization.
                        updatedDate:
                          type: string
                          example: '0001-01-01T00:00:00'
                          description: Date and time when the group was updated.
                  metadata:
                    type: object
                    properties:
                      count:
                        type: number
                        example: 102
                      limit:
                        type: number
                        example: 100
                      offset:
                        type: number
                        example: 2
              examples:
                Group Data:
                  value:
                    groups:
                    - id: 880e60d8-fbed-217a-1720-6511d9f16361
                      createdDate: '0001-01-01T00:00:00'
                      description: Description here
                      fullPath: Test Root Group\Test Parent Group\Test Group Name
                      fullPathId: 880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217a-1720-6511d9f16361
                      name: Test Group Name
                      parentId: 880e60d8-fbed-217b-1720-6511d9f16361
                      revision: 0
                      rootGroupId: 880e60d8-fbed-217c-1720-6511d9f16361
                      updatedDate: '0001-01-01T00:00:00'
                    - id: 880e60d8-fbed-217b-1720-6511d9f16361
                      createdDate: '0001-01-01T00:00:00'
                      description: Description here
                      fullPath: Test Root Group\Test Parent Group
                      fullPathId: 880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217b-1720-6511d9f16361
                      name: Test Parent Group
                      parentId: 880e60d8-fbed-217b-1720-6511d9f16361
                      revision: 1
                      rootGroupId: 880e60d8-fbed-217c-1720-6511d9f16361
                      updatedDate: '0001-01-01T00:00:00'
                    metadata:
                      count: 102
                      limit: 100
                      offset: 2
                Empty:
                  value:
                    groups: []
                    metadata:
                      count: 0
                      limit: 100
                      offset: 0
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: RootGroupId is empty.
              examples:
                Bad Request:
                  value:
                    error: Bad Request
                    message: RootGroupId is empty.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            text/plain:
              examples:
                Forbidden:
                  value: ''
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    post:
      tags:
      - Groups (DriveCam)
      description: Add a new group to the organization.
      summary: Add New Group to Organization
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: The name must be 1-50 printable characters.
              examples:
                Invalid Description:
                  value:
                    error: Bad Request
                    message: The Description max length is 255 printable characters.
                Invalid ParentId Format:
                  value:
                    error: Bad Request
                    message: The ParentId must be a valid UUID.
                Invalid Characters:
                  value:
                    error: Bad Request
                    message: The Name contains invalid characters.
                Reached Maximum Hierarchy Depth:
                  value:
                    error: Bad Request
                    message: Request exceeds maximum group hierarchy depth.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            text/plain:
              examples:
                Forbidden:
                  value: ''
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  message:
                    type: string
                    example: Group already exists with same Name and ParentId.
              examples:
                Conflict:
                  value:
                    error: Conflict
                    message: Group already exists with same Name and ParentId.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    servers:
    - url: https://api.lytx.com/v1
  /groups/{groupIdentifier}:
    get:
      tags:
      - Groups (DriveCam)
      description: Retrieve one group in the organization by group ID.
      summary: Retrieve Specific Group
      security:
      - bearerAuth: []
      parameters:
      - name: groupIdentifier
        in: path
        schema:
          type: string
          example: 880e60d8-fbed-217a-1720-6511d9f16361
        description: ID of the group to return.
        required: true
      - name: encodeFullPath
        in: query
        schema:
          type: boolean
          example: 'false'
          default: true
        description: If true, the group will have its fullPath property url encoded.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: GroupId is empty.
              examples:
                Bad Request:
                  value:
                    error: Bad Request
                    message: GroupId is empty.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            text/plain:
              examples:
                Forbidden:
                  value: ''
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Resource Not Found
                  message:
                    type: string
                    example: The requested resource doesn't exist.
              examples:
                Resource Not Found:
                  value:
                    error: Resource Not Found
                    message: The requested resource doesn't exist.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    put:
      tags:
      - Groups (DriveCam)
      description: Update one group in the organization by group ID.
      summary: Update Specific Group
      security:
      - bearerAuth: []
      parameters:
      - name: groupIdentifier
        in: path
        schema:
          type: string
          example: 880e60d8-fbed-217a-1720-6511d9f16361
        description: ID of the group to return.
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGroupRequest'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: The name must be 1-50 printable characters.
              examples:
                Invalid Id:
                  value:
                    error: Bad Request
                    message: The GroupId must be a valid UUID.
                Invalid Name:
                  value:
                    error: Bad Request
                    message: The name must be 1-50 printable characters.
                Invalid Description:
                  value:
                    error: Bad Request
                    message: The Description max length is 255 printable characters.
                Invalid Characters:
                  value:
                    error: Bad Request
                    message: The Name contains invalid characters.
                Invalid Parent Target:
                  value:
                    error: Bad Request
                    message: The ParentId cannot be a descendant of the target Group.
                Invalid Parent Format:
                  value:
                    error: Bad Request
                    message: The ParentId must be a valid UUID.
                Reached Maximum Hierarchy Depth:
                  value:
                    error: Bad Request
                    message: Request exceeds maximum group hierarchy depth.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: Mandatory Groups cannot be updated.
              examples:
                Group is Default Group:
                  value:
                    error: Forbidden
                    message: Mandatory Groups cannot be updated.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  message:
                    type: string
                    example: Group already exists with same Name and ParentId.
              examples:
                Conflict:
                  value:
                    error: Conflict
                    message: Group already exists with same Name and ParentId.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    delete:
      tags:
      - Groups (DriveCam)
      description: 'Delete a group in the organization.


        Use with extreme caution. Deleting a group that has associated entities will result in orphaned entities, which cannot be recovered.


        Ensure all entities are removed or moved before deleting the group to avoid data loss.

        '
      summary: Delete Group
      security:
      - bearerAuth: []
      parameters:
      - name: groupIdentifier
        in: path
        schema:
          type: string
          example: 880e60d8-fbed-217a-1720-6511d9f16361
        description: ID of the group to delete.
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: Groups with subgroups cannot be deleted.
              examples:
                Group has subgroups:
                  value:
                    error: Bad Request
                    message: Groups with subgroups cannot be deleted.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: Mandatory Groups cannot be deleted.
              examples:
                Group is Default Group:
                  value:
                    error: Forbidden
                    message: Mandatory Groups cannot be deleted.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    servers:
    - url: https://api.lytx.com/v1
  /groups/{groupIdentifier}/descendants:
    get:
      tags:
      - Groups (DriveCam)
      description: Retrieve a list of descendant group IDs for the specified group and depth.
      summary: Retrieve List of Descendant Group IDs
      security:
      - bearerAuth: []
      parameters:
      - name: groupIdentifier
        in: path
        schema:
          type: string
          example: 880e60d8-fbed-217a-1720-6511d9f16361
        description: ID of the group to retrieve group descendant IDs for.
        required: true
      - name: depth
        in: query
        schema:
          type: integer
          example: '2'
        description: "Number of levels of group descendants returned. \n- depth = NULL: Returns children group IDs directly under the specified group.\n- depth = 0: Returns group IDs of all groups within hierarchy. \n- depth = 1: Returns children group IDs directly under the specified group.\n- depth = 2: Returns children and grandchildren group IDs for the specified group. \n- depth > maximum levels in hierarchy: Returns descendant group IDs at all depths for the specified group."
        required: false
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - 880e60d8-fbed-217a-1720-6511d9f16361
              - 880e60d8-fbed-217b-1720-6511d9f16361
              - 880e60d8-fbed-217c-1720-6511d9f16361
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
                    example: GroupId is empty.
              examples:
                Bad Request:
                  value:
                    error: Bad Request
                    message: GroupId is empty.
        '401':
          description: Unauthorized
          content:
            text/plain:
              examples:
                Unauthorized:
                  value: ''
        '403':
          description: Forbidden
          content:
            text/plain:
              examples:
                Forbidden:
                  value: ''
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Resource Not Found
                  message:
                    type: string
                    example: The requested resource doesn't exist.
              examples:
                Resource Not Found:
                  value:
                    error: Resource Not Found
                    message: The requested resource doesn't exist.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: Requested operation cannot be performed.
              examples:
                Internal Server Error:
                  value:
                    error: Internal Server Error
                    message: The requested operation cannot be performed.
    servers:
    - url: https://api.lytx.com/v1
  /groups/auditLogs:
    get:
      tags:
      - Groups (DriveCam)
      description: Retrieve a list of group audit logs in an organization.
      summary: Retrieve List of Group Audit Logs
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          example: '100'
        description: Number of records to return.
      - name: offset
        in: query
        schema:
          type: integer
          example: '0'
        description: Record to start with.
      - name: userIdentifier
        in: query
        schema:
          type: string
        description: ID or username of the user for which to return audit data.
      - name: groupIdentifier
        in: query
        schema:
          type: string
        description: ID of the group for which to return audit data.
      - name: includeSubgroups
        in: query
        schema:
          type: boolean
          example: 'false'
        description: If true, all subgroups under the specified group are included.
      - name: action
        in: query
        schema:
          type: string
        description: The description of the action type (CREATE, UPDATE, DELETE, IMPORT, MOVE).
      - name: startDate
        in: query
        schema:
          type: string
          example: '2024-09-07T00:00:00Z'
        description: The start date and end date must be within 7 days of each other. If no date specified, returns data from the last 7 days.
      - name: endDate
        in: query
        schema:
          type: string
          example: '2024-09-10T00:00:00Z'
        description: The start date and end date must be within 7 days of each other. If no date specified, returns data from the last 7 days.
      - name: sort
        in: query
        schema:
          type: string
          example: UpdatedDate
        description: Name of the property to sort on.
      - name: order
        in: query
        schema:
          type: string
          example: desc
        description: Sort direction.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 880e60d8-fbed-217a-1720-6511d9f16361
                          description: ID of the group.
                        action:
                          type: string
                          example: DELETE
                          description: The description of action type (CREATE, UPDATE, DELETE, IMPORT, MOVE).
                        createdDate:
                          type: string
                          example: '2024-09-06T22:26:09.84'
                          description: Date and time when the group was created.
                        deletedDate:
                          type: string
                          example: '2024-09-26T02:27:09.34'
                          description: Date and time when the group was deleted.
                        description:
                          type: string
                          example: A new group being added.
                          description: Custom field.
                        email:
                          type: string
                          description: The actor’s email.
                        employeeId:
                          type: string
                          description: The actor’s unique employee ID.
                        firstName:
                          type: string
                          description: The actor’s first name.
                        fullPath:
                          type: string
                          example: Test Root Group\Test Parent Group\testGroupName
                          description: Full path from the root group to the target group using group names.
                        fullPathId:
                          type: string
                          example: 880e60d8-fbed-217c-1720-6511d9f16361\880e70d8-aaf8-18aa-7ab0-6533d8f1c360\880e60d8-fbed-217a-1720-6511d9f16361
                          description: Full path from the root group to the target group using group IDs.
                        isDeleted:
                          type: boolean
                          example: true
                          description: Flag for whether or not group is deleted.
                        lastName:
                          type: string
                          description: The actor’s last name.
                        name:
                          type: string
                          example: testGroupName
                          description: Name of the group.
                        parentId:
                          type: string
                          example: 880e70d8-aaf8-18aa-7ab0-6533d8f1c360
                          description: ID of the parent group directly above the target group.
                        revision:
                          type: number
                          example: 4
                          description: Revision number for the group.
                        rootGroupId:
                          type: string
                          example: 880e60d8-fbed-217c-1720-6511d9f16361
                          description: ID of the highest level root group in the organization.
                        userId:
                          type: string
                          description: The actor’s ID in GUID format.
                        username:
                          type: string
                          description: The actor’s unique username.
                        updatedDate:
                          type: string
                          example: '2024-09-06T22:26:09.84'
                          description: Date and time when the group was updated.
                  metadata:
                    type: object
                    properties:
                      count:
                        type: number
                        example: 102
                      limit:
                        type: number
                        example: 100
                      offset:
                        type: number
                        example: 2
              examples:
                Audit Data:
                  value:
                    data:
                    - id: 880e60d8-fbed-217a-1720-6511d9f16361
                      action: UPDATE
                      createdDate: '2024-09-06T22:26:09.84'
                      description: Updated Description here
                      email: johnsmith@gmail.com
                      employeeId: 1234567
                      firstName: John
                      fullPath: Test Root Group\Test Parent Group\Test Group Name
                      fullPathId: 880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217a-1720-6511d9f16361
                      isDeleted: false
                      lastName: Smith
                      name: Test Group Name
                      parentId: 880e60d8-fbed-217b-1720-6511d9f16361
                      revision: 1
                      rootGroupId: 880e60d8-fbed-217c-1720-6511d9f16361
                      userId: 660e60d8-fbed-217c-1720-6511d9f16361
                      userName: johnsmith
                      updatedDate: '2024-09-07T22:26:09.84'
                    - id: 880e60d8-fbed-217b-1720-6511d9f16361
                      action: CREATE
                      createdDate: '2024-09-06T22:26:09.84'
                      description: Description here
                      email: janedoe@hotmail.com
                      fullPath: Test Root Group\Test Parent Group
                      fullPathId: 880e60d8-fbed-217b-1720-6511d9f16361\880e60d8-fbed-217b-1720-6511d9f16361
                      isDeleted: false
                      name: Test Parent Group
                      parentId: 880e60d8-fbed-217b-1720-6511d9f16361

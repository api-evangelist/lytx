components:
  schemas:
    VehicleLocationPage:
      allOf:
      - $ref: '#/components/schemas/PageOfVehicleLocation'
      - type: object
        additionalProperties: false
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          description: Latitude position of the given trackpoint.
          format: double
        longitude:
          type: number
          description: Longitude position of the given trackpoint.
          format: double
        gpsDateTime:
          type: string
          description: The date and time of the given trackpoint
          format: date-time
        direction:
          type:
          - number
          - 'null'
          description: The heading of the vehicle.
          format: double
        speed:
          type:
          - number
          - 'null'
          description: The speed of the vehicle.
          format: double
    VehicleLocation:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: integer
          description: The primary identifier of the vehicle.
          format: int64
        vin:
          type:
          - string
          - 'null'
          description: The VIN number of the vehicle (manually captured).
        deviceVin:
          type:
          - string
          - 'null'
          description: The VIN number of the vehicle (device captures).
        odometer:
          type:
          - integer
          - 'null'
          description: The Odometer value of the vehicle, in Km.
          format: int32
        location:
          description: The location information for the vehicle.
          type:
          - object
          - 'null'
          oneOf:
          - $ref: '#/components/schemas/Location'
    PageOfVehicleLocation:
      type: object
      x-abstract: true
      additionalProperties: false
      properties:
        currentPage:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalRecords:
          type: integer
          format: int32
        vehicles:
          type:
          - array
          - 'null'
          description: The List of vehicles.
          items:
            $ref: '#/components/schemas/VehicleLocation'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    APIKey:
      type: apiKey
      description: Enter your API key
      name: X-APIKey
      in: header

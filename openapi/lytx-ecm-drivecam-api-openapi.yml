        in: path
        required: true
        description: The identifier of the vehicle.
        schema:
          type: integer
          format: int64
        x-position: 1
      - name: time
        in: query
        description: Optional. If supplied, the response will contain the position of the vehicle closest to the given time.
        schema:
          type:
          - string
          - 'null'
          format: date-time
        x-position: 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

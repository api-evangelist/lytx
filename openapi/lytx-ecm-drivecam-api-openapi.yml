    get:
      tags:
      - ECM (DriveCam)
      summary: Retrieve List of Vehicles Associated to Callers Company
      operationId: VehicleInfoAggregate_GetAllVehicleInfoByCompanyId
      parameters:
      - name: page
        in: query
        description: The page number of the list of vehicles. Default is 1. Cannot be less than 1.
        schema:
          type: integer
          format: int32
          default: 1
        x-position: 1
      - name: pageSize
        in: query
        description: The page size of each page. Value should be between 1-1000.
        schema:

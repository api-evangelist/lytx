                          description: Indicates the malfunction state of the log.
                        odometer:
                          type: number
                          format: double
                          example: 1090001.375
                          description: Odometer reading for distance traveled.
                        engineHours:
                          type: number
                          format: double
                          example: 81621
                          description: >-

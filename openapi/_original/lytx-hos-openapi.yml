                        latitude: 32
                        longitude: -111
                        status: D
                        verifyDateTime: '0001-01-01T00:00:00Z'
                        origin: Automatic
                        state: Active
                        malfunction: None
                        odometer: 1090001.375
                        engineHours: 81621
                        eventRecordStatus: 1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HosLogByUserIdentifier:
      title: HosLogByUserIdentifier
      type: object
      properties:
        userName:
          type: string
          example: UnknownDriver
        hosLogs:
          type: array
          items:
            $ref: '#/components/schemas/HosLog'
    HosLogByCompany:
      title: HosLogByCompany
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/HosLogByUserIdentifier'
    HosLog:
      title: HosLog
      type: array
      nullable: true
      items:
        properties:
          userName:
            type: string
            example: UnknownDriver
          dateTime:
            type: string
            example: '2023-09-21T20:30:40Z'
          vehicleName:
            type: string
            example: 2015 FRD Fleet Express
          companyId:
            type: number
            example: '888'
          editDateTime:
            type: string
            example: '2023-09-21T20:40:40Z'
          latitude:
            type: number
            example: 32.887558
          longitude:
            type: number
            example: -117.212288
          status:
            type: string
            example: D
          verifyDateTime:
            type: string
            example: '2023-01-01T00:00:00Z'
          origin:
            type: string
            example: Automatic
          state:
            type: string
            example: Active
          malfunction:
            type: string
            example: None
          odometer:
            type: number
            example: 1090001.375
          engineHours:
            type: number
            example: 81621
          eventRecordStatus:
            type: integer
            example: 1
          eventCode:
            type: integer
            example: 3
          eventType:
            type: integer
            example: 1
          shipmentCommodity:
            type: string
            example: Videogames
          shipmentDocumentNumber:
            type: string
            example: '1234'
    Error:
      title: Error
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: Not Found Error
        message:
          type: string
          example: The page you are looking for does not exist.

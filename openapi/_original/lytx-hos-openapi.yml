          description: The start date.
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2023-06-02'
          description: End date must be within 8 days for user.
        - name: userIdentifier
          in: query
          required: true
          schema:
            type: string
            format: string
            example: UnknownDriver
          description: userName or Lytx userId.
      responses:
        '200':
          description: Ok

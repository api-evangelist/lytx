aid: lytx
name: Lytx
description: Lytx is a video telematics and fleet management technology company whose Lytx Vision Platform
  combines machine-vision cameras (DriveCam and Surfsight), AI event detection, GPS tracking, and telematics
  data for commercial fleets and safety programs. Lytx exposes an open developer API at api.lytx.com that
  lets integrators access video, real-time GPS and location, vehicle and device data, driver and safety
  event data, and tracking data programmatically to build custom fleet, insurance, maintenance, and routing
  integrations on top of the Lytx platform. Authentication is bearer-token based (with advanced OIDC/SSO/MFA
  options), and the developer portal at developer.lytx.com publishes getting-started guides, authentication
  docs, an API reference, and webhooks documentation.
